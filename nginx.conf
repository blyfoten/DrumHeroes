server {
    listen 80;
    server_name drumheroes.cfor.se;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;

    # Only the static app is published. server.py (Demucs upload API) is not
    # run here, so the app detects "no separation" and hides that feature.
    location /api/ {
        return 404;
    }

    # Never serve source, git metadata or other dotfiles.
    location ~ /\. {
        return 404;
    }

    location ~* \.py$ {
        return 404;
    }

    location / {
        try_files $uri $uri/ =404;
        add_header Cache-Control "no-cache";
    }
}
